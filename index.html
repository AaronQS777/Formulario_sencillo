<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de datos</title>
    <link rel="stylesheet" href="stylesheet/styles.css">
</head>
<body>
    <form id = "formulario"> 
    <h1>Formulario de datos</h1>

    <div>
        <label for="nombre">Ingresa tu nombre</label>
        <input type="text" id = nombre placeholder="Ej. Ana" >
    </div>

    <div>
        <label for="apellidos">Ingresa tus apellidos</label>
        <input type="text" id = apellidos placeholder="Ej. Burgos">
    </div>

    <div>
        <label for="tipo_doc">Elige tu tipo de documento</label>
        <select id="tipo_doc">
            <option value="CC" disabled selected>Seleccione...</option>
            <option value="CC">Cedula de ciudadania</option>
            <option value="TI">Tarjeta de identidad</option>
            <option value="PPT">Pasaporte</option>
        </select>
    </div>


    <div>
        <label for="dni">Introduce tu numero de documento</label>
        <input type="text" placeholder="1234567">
  

        <label for="fecha_nacimiento">Introduce tu fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" placeholder="12/12/2000">

        <label for="correo">Introduce tu correo electronico</label>
        <input type="email" id = correo placeholder="persona@gmail.com">
    </div>
    
    
    <div class="checkbox-container">
        <input type="checkbox" id="datos">
        <label for="datos">Acepto el tratamiento de mis datos personales</label>
    </div>
    

    <button>Enviar</button>
    </form>

</body>
</html>
